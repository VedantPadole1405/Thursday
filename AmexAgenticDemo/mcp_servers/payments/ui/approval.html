
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Payment Approval</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      color: #1f2937;
      background: #ffffff;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      max-width: 450px;
    }

    .amount {
      font-size: 30px;
      font-weight: 700;
      margin: 16px 0;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      gap: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    #approve {
      background: #166534;
      color: white;
      border: none;
    }

    #reject {
      background: white;
      color: #991b1b;
      border: 1px solid #991b1b;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Payment Approval</h2>
    <p>Review this simulated payment.</p>

    <div class="amount" id="amount">
      Loading...
    </div>

    <div class="detail">
      <span>Account</span>
      <strong id="account">—</strong>
    </div>

    <div class="detail">
      <span>Recipient</span>
      <strong id="recipient">—</strong>
    </div>

    <div class="detail">
      <span>Payment ID</span>
      <span id="payment-id">—</span>
    </div>

    <div class="detail">
      <span>Status</span>
      <strong id="payment-status">—</strong>
    </div>

    <div class="buttons">
      <button id="approve" disabled>Approve</button>
      <button id="reject" disabled>Reject</button>
    </div>

    <p id="status" role="status"></p>
  </div>

  <script type="module" src="./approval.js"></script>
</body>
</html>
